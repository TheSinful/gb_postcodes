[package]
name = "gb_postcodes"
version = "1.0.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", optional = true }

[build-dependencies]
reqwest = { version = "0.13.3", features = ["blocking"], optional = true }
zip = { version = "8.6.0", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"], optional = true }

[features]
geo = ["reqwest", "zip", "serde", "postcard"]
use_near_codes = ["geo"]
